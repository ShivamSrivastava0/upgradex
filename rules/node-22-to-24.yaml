- id: NODE24-001
  title: Replace removed process.assert()
  technology: node
  from: 22.x
  to: 24.x
  severity: high
  detector:
    type: call-member
    member: assert
    receiver: [process]
  why: process.assert was removed before Node.js 24; use the assert module.
  guidance: Import node:assert and call assert(condition), preserving the intended message behavior.
  source: https://nodejs.org/en/blog/migrations/v22-to-v24
  verified: true
- id: NODE24-002
  title: Use fs.constants for access flags
  technology: node
  from: 22.x
  to: 24.x
  severity: medium
  detector:
    type: member-access
    member: F_OK
    receiver: fs
  why: Node.js deprecates F_OK exposed directly from node:fs; read it from fs.constants.
  guidance: Replace fs.F_OK with fs.constants.F_OK and check other direct access-mode constants.
  codemod: node-fs-constants
  source: https://nodejs.org/en/blog/migrations/v22-to-v24
  verified: true
